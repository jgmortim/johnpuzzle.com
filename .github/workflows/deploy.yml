name: Deploy Website

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install build tools
        run: npm install --no-save esbuild sass svgo

      - name: Build site
        run: |
          mkdir -p dist

          # Copy static assets, excluding source JS and SCSS
          rsync -av \
            --exclude='*.js' \
            --exclude='*.scss' \
            site/ dist/

          # Minify JS
          npx esbuild site/js/*.js --minify --outdir=dist/js

          # Compile SCSS to minified CSS 
          npx sass site/scss:dist/css --style=compressed
          
          # Minify SVGs
          npx svgo -f dist/ -r

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan ${{ secrets.DREAMHOST_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via rsync
        run: |
          rsync -avz --delete \
            dist/ \
            ${{ secrets.DREAMHOST_USERNAME }}@${{ secrets.DREAMHOST_HOST }}:/home/${{ secrets.DREAMHOST_USERNAME }}/johnpuzzle.com/
